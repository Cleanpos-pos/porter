<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Image Optimizer - Porterhouse Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .upload-text {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #999;
            font-size: 14px;
        }

        input[type="file"] {
            display: none;
        }

        .settings {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9ff;
            border-radius: 10px;
        }

        .setting-group {
            margin-bottom: 20px;
        }

        .setting-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: #ddd;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #667eea;
            cursor: pointer;
            border: none;
        }

        .value-display {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .results {
            margin-top: 30px;
        }

        .image-card {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .image-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .image-info {
            flex: 1;
        }

        .image-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .image-stats {
            display: flex;
            gap: 20px;
            font-size: 13px;
            color: #666;
        }

        .stat {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 2px;
        }

        .stat-value {
            font-weight: 600;
        }

        .savings {
            color: #10b981;
            font-weight: 700;
        }

        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: transform 0.2s ease;
        }

        .download-btn:hover {
            transform: translateY(-2px);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-all {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 16px;
        }

        .progress {
            margin-top: 20px;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🖼️ Free Image Optimizer</h1>
        <p class="subtitle">Optimize your restaurant gallery images - No installation required!</p>

        <div class="upload-area" id="uploadArea">
            <div class="upload-icon">📁</div>
            <div class="upload-text">Click to upload or drag & drop images</div>
            <div class="upload-hint">Supports JPG, PNG, WebP • Multiple files allowed</div>
            <input type="file" id="fileInput" accept="image/*" multiple>
        </div>

        <div class="settings">
            <div class="setting-group">
                <label>
                    Quality: <span class="value-display" id="qualityValue">85%</span>
                </label>
                <input type="range" id="quality" min="1" max="100" value="85">
            </div>

            <div class="setting-group">
                <label>
                    Max Width: <span class="value-display" id="widthValue">1920px</span>
                </label>
                <input type="range" id="maxWidth" min="800" max="3840" step="80" value="1920">
            </div>

            <div class="setting-group">
                <label>
                    Output Format: <span class="value-display" id="formatValue">JPEG</span>
                </label>
                <select id="format"
                    style="width: 100%; padding: 10px; border-radius: 8px; border: 2px solid #ddd; font-size: 14px;">
                    <option value="image/jpeg">JPEG (Best for photos)</option>
                    <option value="image/webp">WebP (Smaller size)</option>
                    <option value="image/png">PNG (Lossless)</option>
                </select>
            </div>
        </div>

        <div id="progress" class="progress hidden"></div>
        <div id="results" class="results hidden"></div>
    </div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const qualitySlider = document.getElementById('quality');
        const widthSlider = document.getElementById('maxWidth');
        const formatSelect = document.getElementById('format');
        const qualityValue = document.getElementById('qualityValue');
        const widthValue = document.getElementById('widthValue');
        const formatValue = document.getElementById('formatValue');
        const progress = document.getElementById('progress');
        const results = document.getElementById('results');

        let optimizedImages = [];

        // Update value displays
        qualitySlider.addEventListener('input', (e) => {
            qualityValue.textContent = e.target.value + '%';
        });

        widthSlider.addEventListener('input', (e) => {
            widthValue.textContent = e.target.value + 'px';
        });

        formatSelect.addEventListener('change', (e) => {
            const formats = {
                'image/jpeg': 'JPEG',
                'image/webp': 'WebP',
                'image/png': 'PNG'
            };
            formatValue.textContent = formats[e.target.value];
        });

        // Upload area interactions
        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        async function handleFiles(files) {
            if (files.length === 0) return;

            optimizedImages = [];
            results.innerHTML = '';
            results.classList.add('hidden');
            progress.classList.remove('hidden');
            progress.innerHTML = '<div class="spinner"></div>Optimizing images...';

            for (let i = 0; i < files.length; i++) {
                await optimizeImage(files[i]);
            }

            progress.classList.add('hidden');
            results.classList.remove('hidden');

            // Add download all button
            if (optimizedImages.length > 1) {
                const downloadAllBtn = document.createElement('button');
                downloadAllBtn.className = 'download-btn download-all';
                downloadAllBtn.textContent = `Download All ${optimizedImages.length} Images`;
                downloadAllBtn.onclick = downloadAll;
                results.appendChild(downloadAllBtn);
            }
        }

        async function optimizeImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();

                reader.onload = (e) => {
                    const img = new Image();

                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');

                        // Calculate new dimensions
                        const maxWidth = parseInt(widthSlider.value);
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = (height * maxWidth) / width;
                            width = maxWidth;
                        }

                        canvas.width = width;
                        canvas.height = height;

                        // Draw and compress
                        ctx.drawImage(img, 0, 0, width, height);

                        const quality = qualitySlider.value / 100;
                        const format = formatSelect.value;

                        canvas.toBlob((blob) => {
                            const originalSize = file.size;
                            const newSize = blob.size;
                            const savings = ((1 - newSize / originalSize) * 100).toFixed(1);

                            // Get file extension
                            const ext = format === 'image/jpeg' ? '.jpg' :
                                format === 'image/webp' ? '.webp' : '.png';
                            const newName = file.name.replace(/\.[^/.]+$/, ext);

                            optimizedImages.push({
                                blob: blob,
                                name: newName,
                                originalSize: originalSize,
                                newSize: newSize,
                                savings: savings,
                                url: URL.createObjectURL(blob)
                            });

                            displayResult(optimizedImages[optimizedImages.length - 1]);
                            resolve();
                        }, format, quality);
                    };

                    img.src = e.target.result;
                };

                reader.readAsDataURL(file);
            });
        }

        function displayResult(imageData) {
            const card = document.createElement('div');
            card.className = 'image-card';

            card.innerHTML = `
                <img src="${imageData.url}" alt="${imageData.name}" class="image-preview">
                <div class="image-info">
                    <div class="image-name">${imageData.name}</div>
                    <div class="image-stats">
                        <div class="stat">
                            <span class="stat-label">Original</span>
                            <span class="stat-value">${formatBytes(imageData.originalSize)}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Optimized</span>
                            <span class="stat-value">${formatBytes(imageData.newSize)}</span>
                        </div>
                        <div class="stat">
                            <span class="stat-label">Saved</span>
                            <span class="stat-value savings">${imageData.savings}%</span>
                        </div>
                    </div>
                </div>
                <button class="download-btn" onclick="downloadImage(${optimizedImages.length - 1})">
                    Download
                </button>
            `;

            results.appendChild(card);
        }

        function downloadImage(index) {
            const imageData = optimizedImages[index];
            const link = document.createElement('a');
            link.href = imageData.url;
            link.download = imageData.name;
            link.click();
        }

        function downloadAll() {
            optimizedImages.forEach((imageData, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = imageData.url;
                    link.download = imageData.name;
                    link.click();
                }, index * 200); // Stagger downloads
            });
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }
    </script>
</body>

</html>
